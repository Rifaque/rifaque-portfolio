<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Before first paint: the pinned selected-work stage needs JavaScript
         to follow the scroll, so without it the stacked layout is used. -->
    <script>document.documentElement.classList.add("js")</script>
    <!--
      Title, description, robots, canonical, Open Graph and JSON-LD are
      written per route by scripts/prerender.mjs from src/content/routes.ts.
      In development they are applied at runtime by RouteHead.
    -->
    <!--app-head-->
    <meta name="author" content="Rifaque Ahmed Akrami" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!--app-preload-->
  </head>

  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
