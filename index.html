<!doctype html>
<html lang="en-GB" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      // Before first paint: mark JavaScript, and apply the stored theme so the wrong one never flashes.
      (function () {
        var d = document.documentElement, t = "dark", m;
        d.classList.add("js");
        try { if (localStorage.getItem("rsx-theme") === "light") t = "light"; } catch (e) {}
        if ((m = /[?&]theme=(dark|light)/.exec(location.search))) t = m[1];
        d.dataset.theme = t;
        if (/[?&]motion=reduce/.test(location.search)) d.dataset.motion = "reduce";
        // The loading gate: a visitor's first plain view of the home page. Reduced motion never gets
        // it; those visitors see the hero's drawing at once. Later sessions keep the entrance.
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) return d.classList.add("poster-hold");
        try {
          var nav = performance.getEntriesByType("navigation")[0], net = navigator.connection;
          if (location.pathname !== "/" || location.search || location.hash || scrollY || document.visibilityState !== "visible") return;
          if ((nav && nav.type !== "navigate") || !("WebGL2RenderingContext" in window)) return;
          if (localStorage.getItem("rsx-gate") || sessionStorage.getItem("rsx-intro")) return;
          if (net && (net.saveData || /2g/.test(net.effectiveType))) return;
          localStorage.setItem("rsx-gate", "1");
          sessionStorage.setItem("rsx-intro", "1");
        } catch (e) { return; }
        // Portrait stages take the tall poster (window.__gateShape: poster capture only).
        var shape = window.__gateShape || (innerWidth <= 900 && innerHeight > innerWidth ? "tall" : "wide");
        var poster = "/gate/" + t + (shape === "tall" ? "-tall" : "") + ".webp", l = document.createElement("link");
        d.classList.add("gate");
        d.dataset.gateShape = shape;
        d.style.setProperty("--gate-poster", 'url("' + poster + '")');
        l.rel = "preload"; l.as = "image"; l.href = poster;
        document.head.append(l);
      })();
    </script>
    <!--app-head-->
    <meta name="author" content="Rifaque Ahmed Akrami" />
    <meta name="theme-color" content="#08090b" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-96x96.png" sizes="96x96" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="RSX Develops" />
    <!--app-preload-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
